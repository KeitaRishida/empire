rfeits the stake. Payout includes your original stake. Odds do not change with previous results.</p>',"casino")+card("Luxury portfolio",'<div class="metric gold">'+M(E.L.reduce((a,l,i)=>a+(s.lux[i]?l[1]*.7:0),0))+'</div><p class="muted">Assets held at estimated resale value. Luxury items are permanent collectibles in this version.</p>')+'</div></div>'}

let news=m.headline?'<div class="row"><span class="pill">Upcoming announcement</span><small>'+Math.max(0,Math.ceil(m.headline.at-s.time))+'s</small></div><h3 style="margin-top:12px">'+esc(m.headline.title)+'</h3><p class="muted">'+esc(m.headline.hint)+'</p><small>Sector: '+esc(m.headline.sector)+' · Market reaction uncertain</small>':'<p class="muted">No pending announcements. Watch the news feed.</p>';
return title("Indus Exchange","Fictional Indian-style exchange · simulated prices, every 5 game seconds.")+
'<div class="grid"><div class="stack">'+card("INDUS 16 index",'<div class="metric">'+index.toLocaleString("en-IN",{maximumFractionDigits:2})+'</div><p class="'+(index>=1000?"gain":"loss")+'">'+(index>=1000?"+":"")+((index/1000-1)*100).toFixed(2)+'% since listing</p><div class="metrics">'+metric("Stock portfolio",M(val))+metric("Available cash",M(s.cash))+metric("Unrealized P/L",'<span class="'+(unreal>=0?"gain":"loss")+'">'+M(unreal)+'</span>')+metric("Realized P/L",'<span class="'+(m.realized>=0?"gain":"loss")+'">'+M(m.realized)+'</span>')+metric("Dividends",M(m.dividends))+metric("Fees paid",M(m.fees))+'</div>',"hero")+card("Market intelligence",news+'<div style="margin-top:12px">'+m.feed.map(n=>'<p class="line muted">'+esc(n)+'</p>').join("")+'</div>')+card("Listed companies",rows)+'</div><div class="stack">'+card(b[0]+' · '+b[1],'<div class="label">'+b[2]+' sector</div><div class="big" style="font-size:clamp(30px,4vw,50px)">₹'+p.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})+'</div><p class="'+(trend>=0?"gain":"loss")+'">'+(trend>=0?"+":"")+trend.toFixed(2)+'% over chart period</p>'+spark+'<div class="metrics">'+metric("Shares held",m.holding[i].toLocaleString("en-IN"))+metric("Average cost",m.holding[i]?M(m.basis[i]/m.holding[i]):"—")+metric("Position value",M(p*m.holding[i]))+metric("Position P/L",'<span class="'+(p*m.holding[i]>=m.basis[i]?"gain":"loss")+'">'+M(p*m.holding[i]-m.basis[i])+'</span>')+'</div><div class="segments" style="margin-top:14px">'+[1,10,100,"max"].map(q=>'<button data-action="stockQty:'+q+'" class="'+(q===stockQty?"active":"")+'">'+(q==="max"?"Max":"×"+q)+'</button>').join("")+'</div><div class="row" style="margin-top:12px">'+button("stockBuy","Buy ×"+q+" · "+M(q*p*(1+E.tradeFee)),"primary full",q<1||q*p*(1+E.tradeFee)>s.cash+1e-8)+button("stockSell","Sell ×"+sellq+" · "+M(sellq*p*(1-E.tradeFee)),"full",sellq<1||sellq>m.holding[i])+'</div><p class="muted">↑ ↓ select · ← → quantity · Enter buy · Shift+Enter sell</p>')+card("Trading rules",'<p class="muted">Prices are simulated, not live exchange quotes. The fictional market stays open during gameplay. Prices respond to market-wide sentiment, sector events and company volatility. Announcements give you a short window to prepare; reactions are not guaranteed. Trades cost 0.2%; eligible holdings receive periodic simulated dividends. No leverage, no real money.</p>')+'</div></div>'
}
function awards(){let a=[["First shift",s.works>0],["Entrepreneur",s.spent>0],["Chai empire",s.owned[0]>=25],["Nightlife mogul",s.owned[3]>0],["Well connected",s.rep>=50],["Jet set",s.lux[3]],["Diversified",s.owned.filter(x=>x>0).length>=5],["Billionaire",s.milestones.includes(1e9)],["Trillionaire",s.milestones.includes(1e12)],["World domination",E.rank(s)===1],["Interplanetary mogul",s.owned[12]>0],...E.goals.map(x=>["Net worth "+M(x),s.milestones.includes(x)])];return title("Achievements",a.filter(x=>x[1]).length+" of "+a.length+" milestones completed")+'<div class="grid">'+a.map(x=>'<div class="card award '+(x[1]?"unlocked":"")+'"><div class="row"><h3>'+x[0]+'</h3><span class="'+(x[1]?"gain":"muted")+'">'+(x[1]?"✓":"Locked")+'</span></div></div>').join("")+'</div>'}
function settings(){return title("Settings","Your empire, your rules.")+'<div class="grid"><div class="stack">'+card("Game controls",button("help","Keyboard shortcuts")+button("install","Install on Home Screen")+button("export","Export save")+button("import","Import save")+'<p class="muted">Progress stays on this device. Offline earnings and rival growth are capped at eight hours per absence.</p>')+card("Difficulty",'<div class="segments"><button data-action="difficulty:normal" class="'+(s.difficulty==="normal"?"active":"")+'">Normal</button><button data-action="difficulty:hard" class="'+(s.difficulty==="hard"?"active":"")+'">Hard</button></div><p class="muted">Hard rivals grow 70% faster. Changing difficulty recalculates rival wealth.</p>')+'</div>'+card("Start over",'<p class="muted">Erase holdings, wealth, casino results, reputation, luxury items, awards and rival history. Begin again with ₹100.</p>'+button("reset","Restart from scratch","danger full"))+'</div>'}
function render(force=false){let m=$("main"),old=m.scrollTop,f=document.activeElement,fa=f?.dataset?.action,fb=f?.dataset?.buy,fq=f?.dataset?.qty;if(!force&&f?.id==="stake"){save();return}m.innerHTML="<div>"+[dashboard,business,rivals,lifestyle,awards,settings,exchange][tab]()+"</div>";m.scrollTop=force?0:old;if(!force&&!$("dialog").open){let target=fa?m.querySelector('[data-action="'+fa+'"]'):fb!==undefined?m.querySelector('[data-buy="'+fb+'"]'):fq!==undefined?m.querySelector('[data-qty="'+fq+'"]'):null;target?.focus({preventScroll:true})}if(force||!$("nav").children.length)$("nav").innerHTML=tabs.map((t,i)=>'<button data-tab="'+i+'" class="'+(i===tab?"active":"")+'" aria-current="'+(i===tab?"page":"false")+'"><b>'+t[0]+'</b><span>'+t[1]+' <small>'+t[2]+'</small></span></button>').join("");save()}
function go(i){tab=i;render(true);$("main").focus({preventScroll:true})}
function purchase(i,q=qty){sel=i;E.advance(s);notify(E.buy(s,i,q)?"Purchased "+E.B[i][0]:"Insufficient funds");render()}
function dialog(t,h){$("dialogContent").innerHTML="<h2>"+t+"</h2>"+h;if(!$("dialog").open)$("dialog").showModal()}
function exportSave(){save();let url=URL.createObjectURL(new Blob([JSON.stringify(s)],{type:"application/json"})),a=document.createElement("a");a.href=url;a.download="empire-save.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function action(a){E.advance(s);let [k,v]=a.split(":");switch(k){case"work":E.work(s);break;case"selectStock":stockSel=+v;break;case"stockQty":stockQty=v==="max"?"max":+v;break;case"stockBuy":case"stockSell":notify(E.trade(s,stockSel,k==="stockBuy"?"buy":"sell",stockQty)?"Trade executed":"Insufficient cash or shares");break;case"manager":notify(E.manage(s,+v)?"Manager hired":"Not available");break;case"night":notify(E.night(s,+v)?"Networking boost activated":"Not available");break;case"lux":notify(E.luxury(s,+v)?"Added to your collection":"Not available");break;case"casino":{let r=E.casino(s,v,stake);notify(r?s.casinoResult:"Enter a valid stake within the limit");break}case"difficulty":s.difficulty=v;break;case"help":dialog("Keyboard controls",[["Space","Work"],["1–0","Buy ventures 1–10"],["↑ ↓ / Home / End","Select venture"],["← →","Purchase quantity"],["Enter / Shift+Enter","Buy / buy 10"],["D B M L A S X / F1–F7","Navigate"],["Exchange: ↑ ↓ / ← →","Select stock / quantity"],["Exchange: Enter / Shift+Enter","Buy / sell"],["? / Esc","Help / close"]].map(x=>row("<kbd>"+x[0]+"</kbd>",x[1])).join(""));return;case"install":dialog("Install EMPIRE",'<p>Open the published game in Safari. Tap Share → Add to Home Screen → Open as Web App → Add.</p><p class="muted">Open it from the new icon once while online to cache game files.</p>');return;case"export":exportSave();return;case"import":$("file").click();return;case"reset":dialog("Restart your empire?",'<p>This permanently erases your current game. Begin with ₹100 and fresh rivals.</p>'+button("export","Export a backup first")+button("confirmReset","Erase progress and restart","danger full"));return;case"confirmReset":s=E.fresh();qty=1;sel=0;stake=10;stockSel=0;stockQty=1;lastNews="";$("dialog").close();go(0);notify("New empire started");return;case"close":$("dialog").close();return}render()}
document.addEventListener("input",e=>{if(e.target.id==="stake")stake=Number(e.target.value)});
document.addEventListener("click",e=>{let b=e.target.closest("button");if(b){if(b.dataset.tab!==undefined)go(+b.dataset.tab);else if(b.dataset.buy!==undefined)purchase(+b.dataset.buy);else if(b.dataset.qty!==undefined){qty=b.dataset.qty==="max"?"max":+b.dataset.qty;render()}else if(b.dataset.action)action(b.dataset.action)}else{let v=e.target.closest("[data-select]");if(v){sel=+v.dataset.select;render()}}});
$("file").addEventListener("change",async e=>{try{let f=e.target.files[0];if(!f)return;let n=E.validate(JSON.parse(await f.text()));if(!confirm("Replace your current save?"))return;s=n;E.advance(s);go(0);notify("Save imported")}catch{notify("Invalid or incompatible save")}finally{e.target.value=""}});
document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey||e.target.matches("input,textarea,select,[contenteditable=true]")||$("dialog").open)return;let k=e.key,map={d:0,b:1,m:2,l:3,a:4,s:5,F1:0,F2:1,F3:2,F4:3,F5:4,F6:5,x:6,F7:6};if(k in map||k.toLowerCase() in map){e.preventDefault();go(map[k]??map[k.toLowerCase()]);return}if(k==="?"){e.preventDefault();action("help");return}if(k===" "){if(e.target.closest("button")&&e.target.matches(":focus-visible"))return;e.preventDefault();if(!e.repeat)action("work");return}if(tab===6){if(["ArrowUp","ArrowDown","Home","End","ArrowLeft","ArrowRight","Enter"].includes(k)){if(k==="Enter"&&e.target.closest("button")&&e.target.matches(":focus-visible"))return;e.preventDefault();if(k==="Enter"){if(!e.repeat)action(e.shiftKey?"stockSell":"stockBuy");return}if(k==="ArrowUp")stockSel=Math.max(0,stockSel-1);if(k==="ArrowDown")stockSel=Math.min(E.stocks.length-1,stockSel+1);if(k==="Home")stockSel=0;if(k==="End")stockSel=E.stocks.length-1;if(k==="ArrowLeft"||k==="ArrowRight"){let q=[1,10,100,"max"];stockQty=q[Math.max(0,Math.min(3,q.indexOf(stockQty)+(k==="ArrowRight"?1:-1)))]}render();document.querySelector(".stockrow.selected")?.scrollIntoView({block:"nearest"})}return}if(tab!==1)return;if(/^[0-9]$/.test(k)){e.preventDefault();if(!e.repeat)purchase((+k+9)%10);return}if(["ArrowUp","ArrowDown","Home","End","ArrowLeft","ArrowRight","Enter"].includes(k)){if(k==="Enter"&&e.target.closest("button")&&e.target.matches(":focus-visible"))return;e.preventDefault();if(k==="Enter"){if(!e.repeat)purchase(sel,e.shiftKey?10:qty);return}if(k==="ArrowUp")sel=Math.max(0,sel-1);if(k==="ArrowDown")sel=Math.min(E.B.length-1,sel+1);if(k==="Home")sel=0;if(k==="End")sel=E.B.length-1;if(k==="ArrowLeft"||k==="ArrowRight"){let q=[1,10,"max"];qty=q[Math.max(0,Math.min(2,q.indexOf(qty)+(k==="ArrowRight"?1:-1)))]}render();document.querySelector(".venture.selected")?.scrollIntoView({block:"nearest"})}});
function tick(){E.advance(s);if(s.news[0]&&s.news[0]!==lastNews){lastNews=s.news[0];notify(lastNews)}render()}
document.addEventListener("visibilitychange",()=>{E.advance(s);save();if(!document.hidden)render()});window.addEventListener("pagehide",()=>{E.advance(s);save()});render(true);if(offline>0)notify("Welcome back! Earned "+M(offline));setInterval(()=>{if(!document.hidden){if($("dialog").open){E.advance(s);save()}else tick()}},1000);if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>notify("Offline setup unavailable"));
})();</script></body></html>
