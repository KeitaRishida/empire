function action(a){let [k,v]=a.split(":");if(k==="togglePause"){activeStep();s.paused=!s.paused;clock.stop();activeStep();save();notify(s.paused?"Game paused":"Game resumed");render();return}let running=activeStep();if(!running&&["work","stockBuy","stockSell","manager","night","lux","casino","difficulty","shopBuy","shopEquip","shopSell","confirmShopSell"].includes(k)){notify("Game paused — resume to play");return}switch(k){case"work":E.work(s);motion.feedback('[data-action="work"]');break;case"shopOwned":shopOwned=v==="1";shopBrand="All";shopSel=0;break;case"shopCat":shopCat=[...new Set(E.catalog.map(i=>i.cat))][+v];shopGroup=E.catalog.find(i=>i.cat===shopCat).group;shopBrand="All";shopSel=0;break;case"shopGroup":shopGroup=[...new Set(E.catalog.filter(i=>i.cat===shopCat).map(i=>i.group))][+v];shopBrand="All";shopSel=0;break;case"shopBrand":shopBrand=["All",...new Set(shopBase().map(i=>i.brand))][+v]||"All";shopSel=0;break;case"shopSelect":shopSel=+v;break;case"shopBuy":{let ok=E.purchaseItem(s,v);notify(ok?"Purchase complete":"Insufficient funds or already owned");if(ok)motion.feedback(".shop-tile.selected");break}case"shopEquip":notify(E.equipItem(s,v)?"Selected":"Not owned");break;case"shopSell":{let x=E.catalog.find(i=>i.id===v);if(!x||!s.shop.inventory[v])return;dialog("Sell "+esc(x.name)+"?",'<p>Receive '+M(x.price*x.resale)+' in cash.</p>'+button("confirmShopSell:"+v,"Confirm sale","danger full"));return}case"confirmShopSell":notify(E.sellItem(s,v)?"Item sold":"Not owned");$("dialog").close();break;case"stockSector":stockSector=["All",...new Set(E.stocks.map(b=>b[2]))][+v];break;case"stockOwned":stockOwned=!stockOwned;break;case"selectStock":stockSel=+v;break;case"stockQty":stockQty=v==="max"?"max":+v;break;case"stockBuy":case"stockSell":notify(E.trade(s,stockSel,k==="stockBuy"?"buy":"sell",stockQty)?"Trade executed":"Insufficient cash or shares");break;case"manager":notify(E.manage(s,+v)?"Manager hired":"Not available");break;case"night":notify(E.night(s,+v)?"Networking boost activated":"Not available");break;case"lux":notify(E.luxury(s,+v)?"Added to your collection":"Not available");break;case"casino":{let r=E.casino(s,v,stake);notify(r?s.casinoResult:"Enter a valid stake within the limit");break}case"difficulty":s.difficulty=v;break;case"help":dialog("Keyboard controls",[["Space","Work"],["1–0","Buy ventures 1–10"],["↑ ↓ / Home / End","Select venture"],["← →","Purchase quantity"],["Enter / Shift+Enter","Buy / buy 10"],["D B M L A S X C / F1–F8","Navigate"],["Stores: ↑ ↓","Select item"],["Stores: Enter / Delete","Buy or equip / sell"],["Exchange: ↑ ↓ / ← →","Select stock / quantity"],["Exchange: Enter / Shift+Enter","Buy / sell"],["P","Pause / resume"],["? / Esc","Help / close"]].map(x=>row("<kbd>"+x[0]+"</kbd>",x[1])).join(""));return;case"install":dialog("Install EMPIRE",'<p>Open the published game in Safari. Tap Share → Add to Home Screen → Open as Web App → Add.</p><p class="muted">Open it from the new icon once while online to cache game files.</p>');return;case"export":exportSave();return;case"import":$("file").click();return;case"reset":dialog("Restart your empire?",'<p>This permanently erases your current game. Begin with ₹100 and fresh rivals.</p>'+button("export","Export a backup first")+button("confirmReset","Erase progress and restart","danger full"));return;case"confirmReset":s=E.fresh();s.paused=false;clock.stop();activeStep();qty=1;sel=0;stake=10;stockSel=0;stockQty=1;shopSel=0;shopOwned=false;stockSector="All";stockOwned=false;lastNews="";$("dialog").close();go(0);notify("New empire started");return;case"close":$("dialog").close();return}render()}
document.addEventListener("input",e=>{if(e.target.id==="stake")stake=Number(e.target.value)});
document.addEventListener("click",e=>{let b=e.target.closest("button");if(b){if(b.dataset.tab!==undefined)go(+b.dataset.tab);else if(b.dataset.buy!==undefined)purchase(+b.dataset.buy);else if(b.dataset.qty!==undefined){qty=b.dataset.qty==="max"?"max":+b.dataset.qty;render()}else if(b.dataset.action)action(b.dataset.action)}else{let v=e.target.closest("[data-select]");if(v){sel=+v.dataset.select;render()}}});
$("file").addEventListener("change",async e=>{try{let f=e.target.files[0];if(!f)return;let n=E.validate(JSON.parse(await f.text()));if(!confirm("Replace your current save?"))return;s=n;s.paused=s.paused===true;clock.stop();activeStep();go(0);notify("Save imported")}catch{notify("Invalid or incompatible save")}finally{e.target.value=""}});
document.addEventListener("keydown",e=>{if(e.metaKey||e.ctrlKey||e.altKey||e.target.matches("input,textarea,select,[contenteditable=true]")||$("dialog").open)return;let k=e.key;if(k.toLowerCase()==="p"){e.preventDefault();if(!e.repeat)action("togglePause");return}let map={d:0,b:1,m:2,l:3,a:4,s:5,F1:0,F2:1,F3:2,F4:3,F5:4,F6:5,x:6,F7:6,c:7,F8:7};if(k in map||k.toLowerCase() in map){e.preventDefault();go(map[k]??map[k.toLowerCase()]);return}if(k==="?"){e.preventDefault();action("help");return}if(k===" "){if(e.target.closest("button")&&e.target.matches(":focus-visible"))return;e.preventDefault();if(!e.repeat)action("work");return}if(tab===7){if(["ArrowUp","ArrowDown","Home","End","Enter","Delete"].includes(k)){if(k==="Enter"&&e.target.closest("button")&&e.target.matches(":focus-visible"))return;e.preventDefault();let items=shopItems(),x=shopSelect();if(k==="Enter"&&!e.repeat&&x){action((s.shop.inventory[x.id]?"shopEquip:":"shopBuy:")+x.id);return}if(k==="Delete"&&!e.repeat&&x&&s.shop.inventory[x.id]){action("shopSell:"+x.id);return}if(k==="ArrowUp")shopSel=Math.max(0,shopSel-1);if(k==="ArrowDown")shopSel=Math.min(items.length-1,shopSel+1);if(k==="Home")shopSel=0;if(k==="End")shopSel=items.length-1;render();document.querySelector(".shop-tile.selected")?.scrollIntoView({block:"nearest"})}return}if(tab===6){if(["ArrowUp","ArrowDown","Home","End","ArrowLeft","ArrowRight","Enter"].includes(k)){if(k==="Enter"&&e.target.closest("button")&&e.target.matches(":focus-visible"))return;e.preventDefault();if(k==="Enter"){if(!e.repeat)action(e.shiftKey?"stockSell":"stockBuy");return}if(k==="ArrowUp")stockSel=Math.max(0,stockSel-1);if(k==="ArrowDown")stockSel=Math.min(E.stocks.length-1,stockSel+1);if(k==="Home")stockSel=0;if(k==="End")stockSel=E.stocks.length-1;if(k==="ArrowLeft"||k==="ArrowRight"){let q=[1,10,100,"max"];stockQty=q[Math.max(0,Math.min(3,q.indexOf(stockQty)+(k==="ArrowRight"?1:-1)))]}render();document.querySelector(".stockrow.selected")?.scrollIntoView({block:"nearest"})}return}if(tab!==1)return;if(/^[0-9]$/.test(k)){e.preventDefault();if(!e.repeat)purchase((+k+9)%10);return}if(["ArrowUp","ArrowDown","Home","End","ArrowLeft","ArrowRight","Enter"].includes(k)){if(k==="Enter"&&e.target.closest("button")&&e.target.matches(":focus-visible"))return;e.preventDefault();if(k==="Enter"){if(!e.repeat)purchase(sel,e.shiftKey?10:qty);return}if(k==="ArrowUp")sel=Math.max(0,sel-1);if(k==="ArrowDown")sel=Math.min(E.B.length-1,sel+1);if(k==="Home")sel=0;if(k==="End")sel=E.B.length-1;if(k==="ArrowLeft"||k==="ArrowRight"){let q=[1,10,"max"];qty=q[Math.max(0,Math.min(2,q.indexOf(qty)+(k==="ArrowRight"?1:-1)))]}render();document.querySelector(".venture.selected")?.scrollIntoView({block:"nearest"})}});
function tick(){if(!activeStep()){save();return}if(s.news[0]&&s.news[0]!==lastNews){lastNews=s.news[0];notify(lastNews)}render()}
document.addEventListener("visibilitychange",()=>{if(document.hidden){clock.stop();save()}else{focused=document.hasFocus();clock.stop();syncPresence();render()}});
window.addEventListener("blur",()=>{focused=false;clock.stop();save()});
window.addEventListener("focus",()=>{focused=true;clock.stop();syncPresence()});
window.addEventListener("pagehide",()=>{pageActive=false;clock.stop();save()});
window.addEventListener("pageshow",()=>{pageActive=true;focused=document.hasFocus();clock.stop();syncPresence();render()});
document.addEventListener("freeze",()=>{pageActive=false;clock.stop();save()});
document.addEventListener("resume",()=>{pageActive=true;focused=document.hasFocus();clock.stop();syncPresence()});
document.addEventListener("pointerdown",()=>{if(!focused&&!document.hidden&&document.hasFocus()){focused=true;clock.stop();syncPresence()}});
render(true);setInterval(()=>{if(!document.hidden){if($("dialog").open){activeStep();save()}else tick()}},1000);if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("./sw.js").catch(()=>notify("Offline setup unavailable"));
})();</script></body></html>
